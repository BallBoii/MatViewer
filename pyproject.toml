[project]
name = "matviewer"
version = "0.1.0"
description = "Scientific Image Gallery — interactive 3-D .mat file viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.41",
    "scipy>=1.14",
    "numpy>=2.0",
    "plotly>=5.24",
]

[project.scripts]
matviewer = "app:main"
